      <stop offset="0.5" stop-color="#00C8DC"/>
      <stop offset="1" stop-color="#FF5EA8"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="-1200 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF5EA8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF5EA8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
