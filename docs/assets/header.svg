<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="ShopSphere - C++ OOP console e-commerce store">
  <title>ShopSphere</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14102A"/>
      <stop offset="0.55" stop-color="#1B1438"/>
      <stop offset="1" stop-color="#0E1424"/>
    </linearGradient>
    <!-- cyclic violet -> cyan -> pink -> violet, slid sideways forever (the app's shimmer) -->
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#7C5CFF"/>
